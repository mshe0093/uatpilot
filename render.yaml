# Render Blueprint: one web service that serves the API, the dashboard and headless Chromium.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. See docs/deploy.md.
services:
  - type: web
    name: uatpilot
    runtime: docker
    # Free plan: no persistent disk, so run history resets on each deploy or restart (the seed
    # suites are re-imported on start). For lasting history use plan: starter and add
    #   disk: {name: uatpilot-data, mountPath: /data, sizeGB: 1}
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # auto = the model when a provider key is set, the deterministic rules triage otherwise.
      - key: UATPILOT_ENGINE
        value: auto
      # Secrets: set them in the dashboard, never in this file.
      # With a write token set, visitors get a read-only dashboard; you run suites with the token.
      - key: UATPILOT_WRITE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UATPILOT_MODEL
        value: gemini-3.1-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
