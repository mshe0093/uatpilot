name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests (offline; HTTP is mocked or local, no API key needed)
        run: pytest --cov=uatpilot --cov-report=term-missing

  web:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t uatpilot:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e UATPILOT_ENGINE=rules uatpilot:ci
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/ | grep -q "UATPilot"
          test "$(curl -fs http://127.0.0.1:8000/api/requirement-sets | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" = "$(ls examples/suites/*.seed.json | wc -l | tr -d ' ')"
          ID=$(curl -fs http://127.0.0.1:8000/api/requirement-sets | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          curl -fs "http://127.0.0.1:8000/api/requirement-sets/$ID/export.md" | grep -q "UAT Sign-off"
          docker exec app python -c "from playwright.sync_api import sync_playwright as p; b=p().start().chromium.launch(); b.close()"
          test "$(docker exec app whoami)" = "app"
      - name: Logs on failure
        if: failure()
        run: docker logs app
