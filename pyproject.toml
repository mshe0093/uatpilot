[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uatpilot"
version = "0.2.0"
description = "Turns a requirements doc into structured UAT test cases, runs them against a real target, triages failures and reports the results on a dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["uat", "qa", "testing", "agent", "tool-use", "claude", "playwright", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=2.8",
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/mshe0093/uatpilot"
Issues = "https://github.com/mshe0093/uatpilot/issues"

[project.optional-dependencies]
ui = ["playwright>=1.50"]
dev = [
    "playwright>=1.50",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
uatpilot = "uatpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uatpilot = ["py.typed"]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["live: hits the real public sandbox targets over the network (deselect with -m 'not live')"]
